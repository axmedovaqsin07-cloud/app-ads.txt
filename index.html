<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Madeni Para Koleksiyonum</title><style id="app-css">:root{--bg:#14291f;--card:#1c382b;--ink:#f1ead9;--mute:#aab7a8;--brass:#d2a64a;--line:#2f5240;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.55}
header{padding:40px 20px 24px;max-width:1000px;margin:auto}
h1{font-size:clamp(2rem,6vw,3.2rem);margin:0 0 8px;letter-spacing:.01em;font-weight:700}
header p{margin:0;color:var(--mute);max-width:52ch}
main{max-width:1000px;margin:auto;padding:8px 20px 56px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;align-self:start}
.photo{aspect-ratio:1;border-radius:10px;background:#0f1f17;display:grid;place-items:center;overflow:hidden;position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.disc{width:72%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;color:rgba(0,0,0,.55);box-shadow:inset 0 0 0 6px rgba(0,0,0,.12),inset 0 0 0 9px rgba(255,255,255,.18)}
.gold{background:radial-gradient(circle at 30% 30%,#f6dd8a,#c99a2e)}
.silver{background:radial-gradient(circle at 30% 30%,#f2f4f5,#9aa3a8)}
.bronze{background:radial-gradient(circle at 30% 30%,#e2a06a,#9a5a2c)}
.add{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:var(--ink);font:13px system-ui,sans-serif;padding:6px 10px;border-radius:20px;cursor:pointer}
.add input{display:none}
h2{font-size:1.2rem;margin:0}
.sub{color:var(--mute);font-size:.92rem;margin:0}
button.info{font:600 15px system-ui,sans-serif;background:var(--brass);color:#2a2008;border:0;border-radius:10px;padding:12px;cursor:pointer;min-height:44px}
button.info:focus-visible,.add:focus-within{outline:3px solid var(--ink);outline-offset:2px}
.details{display:none;border-top:1px solid var(--line);padding-top:12px;font-size:.95rem}
.card.open .details{display:block}
.details dt{color:var(--brass);font-weight:700;margin-top:10px}
.details dd{margin:2px 0 0}

.row{display:flex;gap:8px}.row>*{flex:1}
button.g,button.del{font:600 15px system-ui,sans-serif;border-radius:10px;padding:12px;cursor:pointer;min-height:44px;background:transparent;color:var(--ink);border:1px solid var(--brass);text-decoration:none;text-align:center}
button.del{border-color:var(--line);color:var(--mute);flex:0 0 auto;padding:12px 14px}
.bar{max-width:1000px;margin:0 auto;padding:0 20px 20px}
.bar>summary{display:inline-block;list-style:none;background:var(--brass);color:#2a2008;font:700 15px system-ui,sans-serif;padding:12px 18px;border-radius:10px;cursor:pointer}
form{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
form label{display:grid;gap:4px;font:14px system-ui,sans-serif;color:var(--mute)}
form .full{grid-column:1/-1}
input[type=text],select,textarea{font:16px system-ui,sans-serif;background:#0f1f17;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
textarea{min-height:70px}
.note{font:13px system-ui,sans-serif;color:var(--mute);margin:10px 0 0}
.lang{position:absolute;top:14px;right:16px;background:transparent;color:var(--ink);border:1px solid var(--brass);border-radius:20px;font:600 14px system-ui,sans-serif;padding:8px 14px;cursor:pointer;min-height:40px}
header{position:relative}
#st{font:14px system-ui,sans-serif;color:var(--brass);margin:0}
button.alt{font:600 15px system-ui,sans-serif;background:transparent;color:var(--ink);border:1px solid var(--brass);border-radius:10px;padding:12px;cursor:pointer;min-height:44px}
</style></head><body><div id="root"></div><template id="shell"><header><button class="lang" id="lang" type="button">ქართული</button><h1 id="t1"></h1><p id="t2"></p></header>
<details class="bar" id="bar" hidden><summary id="t3"></summary>
<form id="f">
<label class="full">Fotoğraf<input type="file" id="ph" accept="image/*"></label>
<label class="full">Paranın adı<input type="text" id="ad" required></label>
<p class="note full" style="margin:0">Sadece fotoğraf ve adı gir. Diğer alanları boş bırakırsan yapay zeka araştırıp doldurur. İstersen kendin de yazabilirsin.</p>
<label>Ülke<input type="text" id="ulke"></label>
<label>Yıl<input type="text" id="yil"></label>
<label class="full">Metal<select id="metal"><option value="">Otomatik (yapay zeka)</option><option value="gold">Altın</option><option value="silver">Gümüş</option><option value="bronze">Bakır / Bronz</option></select></label>
<label class="full">Metal bilgisi (ayar, gram vb.)<input type="text" id="mb"></label>
<label class="full">O dönem ülkenin durumu<textarea id="du"></textarea></label>
<label class="full">Neden basıldı<textarea id="ne"></textarea></label>
<label class="full">İlginç bilgi<textarea id="il"></textarea></label>
<p id="st" class="full" role="status"></p>
<button class="alt" id="fillb" type="button">Yapay zeka ile doldur</button>
<button class="info" type="submit">Koleksiyona ekle</button>
</form>
<button class="alt" id="trb" type="button" style="margin-top:12px">Gürcüce çevirileri tamamla</button>
<p class="note">Bu bölümü sadece sen görürsün. Yapay zeka bilgilerde hata yapabilir, eklemeden önce kontrol et.</p></details>
<main id="shop"></main></template><script type="application/json" id="data">[{"ad": "Altın Sovereign", "ulke": "Birleşik Krallık", "yil": "1837–1901 (Victoria dönemi)", "metal": "gold", "mb": "22 ayar altın, yaklaşık 7,98 gram", "du": "Ülke Sanayi Devrimi’nin ve dünya ticaretinin merkeziydi; İngiliz İmparatorluğu en geniş dönemine yaklaşıyordu.", "ne": "Altın standardının temel parasıydı. Değeri sabit olduğu için dünyada güvenle kabul edilirdi.", "il": "Arka yüzdeki Aziz George ejderhayla savaşırken görülür. Bu tasarım sanatçı Benedetto Pistrucci’ye aittir."}, {"ad": "Morgan Gümüş Doları", "ulke": "Amerika Birleşik Devletleri", "yil": "1878–1904 ve 1921", "metal": "silver", "mb": "%90 gümüş, %10 bakır, yaklaşık 26,73 gram", "du": "Ülke hızla sanayileşiyordu ve batıdaki gümüş madenleri çok gümüş çıkarıyordu.", "ne": "Gümüş madencilerini desteklemek ve dolaşımda daha çok gümüş para bulundurmak için basıldı.", "il": "Adını tasarımcısı George T. Morgan’dan alır. Özgürlük Heykeli figürü için Philadelphia’da bir öğretmen model olmuştur."}, {"ad": "Roma Denarius’u", "ulke": "Roma İmparatorluğu", "yil": "Yaklaşık MÖ 27 – MS 14 (Augustus dönemi)", "metal": "silver", "mb": "Gümüş, yaklaşık 3,9 gram", "du": "Uzun iç savaşlardan sonra Augustus ile barış ve düzen dönemi başlamıştı.", "ne": "Askerlere maaş ödemek ve geniş imparatorlukta ticareti kolaylaştırmak için basıldı.", "il": "Denarius yüzyıllar boyunca Roma’nın en bilinen gümüş parası oldu. Üzerindeki portreler, imparatorun halka mesaj verme yoluydu."}, {"ad": "Osmanlı Kuruşu", "ulke": "Osmanlı Devleti", "yil": "II. Abdülhamid dönemi (1876–1909)", "metal": "silver", "mb": "Gümüş (ayarını kendi paranla kontrol et)", "du": "Devlet mali sıkıntı yaşıyor, toprak kaybediyor ve modernleşmeye çalışıyordu.", "ne": "Gündelik ticarette kullanılan devlet parasıydı.", "il": "Osmanlı paralarının üzerinde padişahın imzası olan tuğra bulunur."}, {"ad": "Jjjj", "ulke": "Jjh", "yil": "Nk", "metal": "silver", "mb": "Cc", "du": "gcc", "ne": "Ggg", "il": "G"}]</script><script id="app-js">var SHELL=document.getElementById("shell"),root=document.getElementById("root");
root.appendChild(SHELL.content.cloneNode(true));
var coins=[];try{coins=JSON.parse(document.getElementById("data").textContent)}catch(e){}
var canEdit=false,artifact=null,syms={gold:"Au",silver:"Ag",bronze:"Cu"},lang="tr";
try{lang=localStorage.getItem("lang")==="ka"?"ka":"tr"}catch(e){}
var shop=document.getElementById("shop");
var L={tr:{t1:"Madeni Para Koleksiyonum",t2:"Elimdeki paralar. Bilgiler düğmesine basınca parayla ilgili ayrıntıları görürsün.",t3:"Yeni para ekle",info:"Bilgiler",hide:"Bilgileri gizle",g:"Google’da ara",del:"Sil",sure:"Emin misin?",up:"Fotoğraf yükle",empty:"Henüz para eklenmedi.",btn:"ქართული",ad:"Para",yil:"Yıl",ulke:"Ülke",mb:"Metal",du:"Ülkenin durumu",ne:"Neden basıldı",il:"İlginç bilgi"},
ka:{t1:"ჩემი მონეტების კოლექცია",t2:"ჩემი მონეტები. დააჭირე ღილაკს „ინფორმაცია“ დეტალების სანახავად.",t3:"ახალი მონეტის დამატება",info:"ინფორმაცია",hide:"დამალვა",g:"მოძებნე Google-ში",del:"წაშლა",sure:"დარწმუნებული ხარ?",up:"ფოტოს ატვირთვა",empty:"მონეტები ჯერ არ დამატებულა.",btn:"Türkçe",ad:"მონეტა",yil:"წელი",ulke:"ქვეყანა",mb:"ლითონი",du:"ქვეყნის მდგომარეობა",ne:"რატომ იჭრებოდა",il:"საინტერესო ფაქტი"}};
function T(k){return L[lang][k]}
function F(c,k){return lang==="ka"&&c.ka&&c.ka[k]?c.ka[k]:c[k]}
function applyLang(){
  document.documentElement.lang=lang==="ka"?"ka":"tr";
  document.getElementById("t1").textContent=T("t1");document.getElementById("t2").textContent=T("t2");
  document.getElementById("t3").textContent=T("t3");document.getElementById("lang").textContent=T("btn");
}
document.getElementById("lang").onclick=function(){lang=lang==="tr"?"ka":"tr";try{localStorage.setItem("lang",lang)}catch(e){}applyLang();render()};
function build(){
  var css=document.getElementById("app-css").textContent,js=document.getElementById("app-js").textContent;
  var json=JSON.stringify(coins).replace(/</g,"\\u003c");
  return '<!DOCTYPE html>\n<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Madeni Para Koleksiyonum</title><style id="app-css">'+css+'</style></head><body><div id="root"></div><template id="shell">'+SHELL.innerHTML+'</template><script type="application/json" id="data">'+json+'</'+'script><script id="app-js">'+js+'</'+'script></body></html>';
}
async function commit(){
  if(!artifact)return;
  try{await artifact.publish(build())}catch(e){if(!e||e.code!=="conflict")alert("Kaydedilemedi: "+((e&&(e.message||e.code))||"bilinmeyen hata"))}
}
function shrink(file,cb){
  var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
    var m=480,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    cb(c.toDataURL("image/jpeg",.7))};im.src=r.result};r.readAsDataURL(file)}
function toBlob(u){var b=atob(u.split(",")[1]),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Blob([a],{type:"image/jpeg"})}
var KEYS=["ulke","yil","mb","du","ne","il"];
function st(t){document.getElementById("st").textContent=t||""}
async function aiFill(c){
  var s=await claude.use("sample");if(!s)throw new Error("Yapay zeka şu an kullanılamıyor.");
  var known={};KEYS.forEach(function(k){if(c[k])known[k]=c[k]});
  var opts={};
  try{if(c.foto&&(await s.limits()).images)opts.images=[toBlob(c.foto)]}catch(e){}
  var p="Bir madeni para koleksiyonu sitesi için bu para hakkında Türkçe bilgi yaz.\nPara adı: "+c.ad+"\nSahibinin zaten girdiği bilgiler (değiştirme): "+JSON.stringify(known)+(opts.images?"\nParanın fotoğrafı ekte; yazıları ve görseli kullan.":"")+
  "\nSadece şu anahtarlarla JSON döndür: {\"ulke\":\"\",\"yil\":\"\",\"metal\":\"gold|silver|bronze\",\"mb\":\"metal bilgisi: ayar ve gram\",\"du\":\"o dönem ülkenin durumu\",\"ne\":\"neden basıldı\",\"il\":\"ilginç bir bilgi\"}.\nHer alan en çok 2 kısa cümle olsun. Emin olmadığın bilgiyi uydurma, bu durumda \"kesin değil\" diye belirt.";
  var r=await s.json(p,opts);
  KEYS.forEach(function(k){if(!c[k]&&r[k])c[k]=String(r[k])});
  if(!c.metal&&/^(gold|silver|bronze)$/.test(r.metal))c.metal=r.metal;
}
async function aiTranslate(c){
  var s=await claude.use("sample");if(!s)throw new Error("Yapay zeka şu an kullanılamıyor.");
  var src={ad:c.ad};KEYS.forEach(function(k){if(c[k])src[k]=c[k]});
  var r=await s.json("Translate the string values of this JSON object into Georgian (ქართული). Keep the same keys. Coin names: translate or transliterate into Georgian script. Return only the JSON object.\n"+JSON.stringify(src));
  var o={};Object.keys(src).forEach(function(k){if(r[k])o[k]=String(r[k])});c.ka=o;
}
function render(){
  shop.innerHTML="";
  if(!coins.length){var p=document.createElement("p");p.className="sub";p.style.gridColumn="1/-1";p.textContent=T("empty");shop.appendChild(p)}
  coins.forEach(function(c,idx){
    var d=document.createElement("article");d.className="card";
    d.innerHTML='<div class="photo"><div class="disc"></div>'+(canEdit?'<label class="add"><span></span><input type="file" accept="image/*"></label>':'')+'</div>'+
    '<div><h2></h2><p class="sub"></p></div><button class="info" aria-expanded="false"></button>'+
    '<div class="row"><a class="g" target="_blank" rel="noopener"></a>'+(canEdit?'<button class="del" type="button"></button>':'')+'</div><dl class="details"></dl>';
    var disc=d.querySelector(".disc");disc.className="disc "+(c.metal||"silver");disc.textContent=syms[c.metal]||"";
    if(c.foto){disc.style.display="none";var im=document.createElement("img");im.alt=c.ad;im.src=c.foto;d.querySelector(".photo").prepend(im)}
    d.querySelector("h2").textContent=F(c,"ad");
    d.querySelector(".sub").textContent=[F(c,"ulke"),F(c,"yil")].filter(Boolean).join(", ");
    var dl=d.querySelector("dl");
    KEYS.forEach(function(k){var val=F(c,k);if(!val)return;var t=document.createElement("dt"),v=document.createElement("dd");t.textContent=T(k==="mb"?"mb":k);v.textContent=val;dl.append(t,v)});
    var g=d.querySelector("a.g");g.textContent=T("g");
    g.href="https://www.google.com/search?q="+encodeURIComponent([c.ad,c.yil,c.ulke,"madeni para"].filter(Boolean).join(" "));
    var b=d.querySelector("button.info");b.textContent=T("info");
    b.onclick=function(){var o=d.classList.toggle("open");b.setAttribute("aria-expanded",o);b.textContent=o?T("hide"):T("info")};
    if(canEdit){
      d.querySelector(".add span").textContent=T("up");
      var del=d.querySelector("button.del");del.textContent=T("del");
      del.onclick=function(){if(del.dataset.s){coins.splice(idx,1);commit()}else{del.dataset.s=1;del.textContent=T("sure");setTimeout(function(){del.dataset.s="";del.textContent=T("del")},3000)}};
      d.querySelector("input").onchange=function(e){var f=e.target.files[0];if(!f)return;shrink(f,function(u){c.foto=u;commit()})};
    }
    shop.appendChild(d);
  });
}
function readForm(){
  function v(i){return document.getElementById(i).value.trim()}
  return {ad:v("ad"),ulke:v("ulke"),yil:v("yil"),metal:v("metal"),mb:v("mb"),du:v("du"),ne:v("ne"),il:v("il")};
}
function writeForm(c){["ulke","yil","mb","du","ne","il"].forEach(function(k){document.getElementById(k).value=c[k]||""});if(c.metal)document.getElementById("metal").value=c.metal}
function withPhoto(c,cb){var f=document.getElementById("ph").files[0];if(f)shrink(f,function(u){c.foto=u;cb()});else cb()}
document.getElementById("fillb").onclick=function(){
  var c=readForm();if(!c.ad){st("Önce paranın adını yaz.");return}
  st("Yapay zeka araştırıyor…");
  withPhoto(c,function(){aiFill(c).then(function(){writeForm(c);st("Bilgiler dolduruldu. Kontrol edip ekleyebilirsin.")}).catch(function(e){st("Hata: "+(e.message||e.code||"bilinmeyen"))})});
};
document.getElementById("f").onsubmit=function(e){
  e.preventDefault();var c=readForm();
  st("Yapay zeka araştırıyor ve Gürcüceye çeviriyor…");
  withPhoto(c,async function(){
    try{await aiFill(c)}catch(err){st("Yapay zeka doldurulamadı, elindeki bilgilerle ekleniyor. "+(err.message||err.code||""))}
    try{await aiTranslate(c)}catch(err){}
    if(!c.metal)c.metal="silver";
    coins.push(c);st("Kaydediliyor…");commit();
  });
};
document.getElementById("trb").onclick=async function(){
  var b=this;b.disabled=true;
  try{for(var i=0;i<coins.length;i++){if(!coins[i].ka){b.textContent="Çevriliyor "+(i+1)+"/"+coins.length;await aiTranslate(coins[i])}}
    b.textContent="Kaydediliyor…";commit()}
  catch(e){b.textContent="Hata: "+(e.message||e.code||"bilinmeyen");b.disabled=false}
};
applyLang();render();
(async function(){
  try{
    var u=await claude.use("user"),a=await claude.use("artifact");
    if(u&&a&&(u.isOwner()||u.canEdit())){canEdit=true;artifact=a;document.getElementById("bar").hidden=false;render()}
  }catch(e){}
})();</script></body></html>
