<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diyet & Sağlık Takip Uygulaması</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            padding: 50px 20px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { color: #2e7d32; }
        p { font-size: 16px; line-height: 1.5; }
        .btn {
            display: inline-block;
            background-color: #2e7d32;
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 20px;
            font-weight: bold;
        }
        .btn:hover { background-color: #1b5e20; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Diyet Takip Uygulaması</h1>
        <p>Sağlıklı yaşam ve diyet takibin için geliştirilmiş özel mobil uygulama!</p>
        <p>Hemen ücretsiz indirin ve kullanmaya başlayın.</p>
        <a href="DiyetUygulamasi.apk" class="btn">Uygulamayı İndir (APK)</a>
    </div>
</body>
</html>
